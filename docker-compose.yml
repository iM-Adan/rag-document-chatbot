services:
  api:
    build: .
    image: rag-chatbot:latest
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATA_DIR: /app/data
      CHROMA_DIR: /app/chroma_db
    volumes:
      - ./data:/app/data
      - chroma_db:/app/chroma_db
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  chroma_db:
  hf_cache: